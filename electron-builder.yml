appId: com.leecoor.agent-dashboard
productName: Agent Dashboard
copyright: Copyright © 2026 Lee Coor

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - renderer/out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/*.{ts,tsx,map}"
  - "!**/tsconfig*.json"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing config left empty for first build — fill identity later when distributing
  identity: null

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
