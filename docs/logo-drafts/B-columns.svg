<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Plan B: three-column dashboard silhouette -->
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f1f27"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bgB)"/>
  <rect x="0.5" y="0.5" width="255" height="255" rx="55.5" ry="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- left: sidebar (narrow, mid height) -->
  <rect x="52"  y="84"  width="32" height="88"  rx="8" fill="#FF7A45"/>
  <!-- center: main pane (wide, full height) -->
  <rect x="96"  y="56"  width="64" height="144" rx="10" fill="#F3F4F6"/>
  <!-- right: detail (medium width, mid height) -->
  <rect x="172" y="76"  width="36" height="104" rx="8" fill="#10B981"/>
</svg>
